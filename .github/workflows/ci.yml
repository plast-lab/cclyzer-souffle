name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  nix:
    # Builds the fact generator in the flake's environment and runs
    # make test-facts (flake.nix, checks.default).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L

  docker:
    # Builds the Docker image: Ubuntu 24.04, Soufflé, LLVM, the fact
    # generator and every compiled analysis.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cclyzer .
